<!doctype html>
<html lang="ar" dir="rtl" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#f59e0b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NerdMiner" />
    <link rel="manifest" href="./manifest.json" />
    <title>NerdMiner 2.8" تعدين البيتكوين الفردي الذكي</title>
    <meta name="description" content="NerdMiner & Binghe 2.8' TFT Solo Bitcoin Lottery Miner with multi-threaded Web Worker SHA-256 double-hashing." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Chakra+Petch:ital,wght@0,400;0,600;0,700;1,700&family=Orbitron:wght@400;600;700;900&family=Share+Tech+Mono&family=Tajawal:wght@400;500;700;900&family=VT323&display=swap" rel="stylesheet">
    
    <!-- أداة Eruda لإظهار زر Console عائم على شاشة الهاتف لفحص الأخطاء -->
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>
  </head>
  <body class="bg-[#0c0d12] text-slate-100 selection:bg-amber-500 selection:text-black overflow-x-hidden antialiased font-sans">
    <div id="root"></div>

    <!-- كود تلقائي لإلغاء تسجيل الـ Service Worker القديم وتنظيف ذاكرة الهاتف -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (let registration of registrations) {
            registration.unregister();
          }
        });
      }
    </script>

    <!-- تعديل المسار المباشر إلى مسار نسبي صحيح لـ GitHub Pages -->
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
